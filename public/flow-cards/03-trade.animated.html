<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>교역 한 항차 — 매입부터 매각까지</title>
<style>
  :root {
    --page: #f6f6f4;
    --panel: #ffffff;
    --ink: #1b1b1a;
    --ink-soft: #5d5d58;
    --rule: #dcdcd6;
    --accent: #2f6fde;
    --reject: #d0453a;
    --diagram-bg: #ffffff;
    --diagram-alt: #ececE7;
    --space-1: 4px;
    --space-2: 6px;
    --space-3: 8px;
    --space-4: 10px;
    --space-5: 12px;
    --space-6: 16px;
    --space-7: 20px;
    --space-8: 24px;
    --radius-s: 4px;
    --radius-m: 8px;
    --radius-l: 12px;
    --text-xs: 12px;
    --text-s: 13px;
    --text-m: 15px;
    --text-l: 18px;
    --icon: 16px;
    --icon-nudge: -3px;
    --control-h: 34px;
    --count-w: 64px;
    --scrub-min: 160px;
    --scrub-basis: 220px;
    --caption-h: 24px;
    --blur: 6px;
    --focus-w: 2px;
    --v-cap-h: 150px;
    --v-pad: 40px;
    --v-text-l: 40px;
    --v-text-m: 30px;
    --page-max: 1760px;
    --dur-press: 120ms;
    --dur-hover: 150ms;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #141413;
      --panel: #1e1e1c;
      --ink: #ececea;
      --ink-soft: #a3a39d;
      --rule: #34342f;
      --accent: #6d9cff;
      --reject: #ff7a6e;
      --diagram-bg: #1e1e1c;
      --diagram-alt: #2b2b28;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #141413;
    --panel: #1e1e1c;
    --ink: #ececea;
    --ink-soft: #a3a39d;
    --rule: #34342f;
    --accent: #6d9cff;
    --reject: #ff7a6e;
    --diagram-bg: #1e1e1c;
    --diagram-alt: #2b2b28;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--ink);
    font-size: var(--text-m); line-height: 1.5; font-family: var(--font-ui);
  }
  header { padding: var(--space-7) var(--space-6) var(--space-3); max-width: var(--page-max); margin: 0 auto; }
  h1 { margin: 0; font-size: var(--text-l); font-weight: 650; letter-spacing: -0.01em; }
  .bar {
    position: sticky; top: 0; z-index: 2; background: color-mix(in srgb, var(--page) 92%, transparent);
    backdrop-filter: blur(var(--blur)); border-bottom: 1px solid var(--rule);
  }
  .bar-inner {
    max-width: var(--page-max); margin: 0 auto; padding: var(--space-4) var(--space-6);
    display: flex; flex-wrap: wrap; gap: var(--space-3) var(--space-5); align-items: center;
  }
  button {
    font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--rule);
    border-radius: var(--radius-m); height: var(--control-h); padding: 0 var(--space-4); cursor: pointer;
    transition: transform var(--dur-press) var(--ease-out), border-color var(--dur-hover);
  }
  button:hover { border-color: var(--ink-soft); }
  button:active { transform: scale(0.97); }
  button:focus-visible, input:focus-visible { outline: var(--focus-w) solid var(--accent); outline-offset: var(--focus-w); }
  button svg { width: var(--icon); height: var(--icon); vertical-align: var(--icon-nudge); fill: currentColor; }
  .speed { display: inline-flex; }
  .speed button { border-radius: 0; margin-left: -1px; }
  .speed button:first-child { border-radius: var(--radius-m) 0 0 var(--radius-m); margin-left: 0; }
  .speed button:last-child { border-radius: 0 var(--radius-m) var(--radius-m) 0; }
  .speed button[aria-checked="true"] { background: var(--ink); color: var(--panel); border-color: var(--ink); position: relative; }
  .scrub { flex: 1 1 var(--scrub-basis); min-width: var(--scrub-min); accent-color: var(--accent); }
  .count { font-variant-numeric: tabular-nums; color: var(--ink-soft); min-width: var(--count-w); text-align: right; }
  label.follow { color: var(--ink-soft); display: flex; gap: var(--space-2); align-items: center; user-select: none; }
  .caption {
    flex: 1 0 100%; min-height: var(--caption-h); font-weight: 550;
    display: flex; gap: var(--space-4); align-items: baseline; overflow: hidden;
  }
  .caption .section { color: var(--ink-soft); font-weight: 450; white-space: nowrap; }
  .caption .text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .caption .text.is-reject { color: var(--reject); }
  main { max-width: var(--page-max); margin: 0 auto; padding: var(--space-6); }
  .stage {
    background: var(--diagram-bg); border: 1px solid var(--rule); border-radius: var(--radius-l);
    padding: var(--space-6); overflow-x: auto;
  }
  .stage svg.ondine {
    display: block; margin: 0 auto;
    --ondine-bg: var(--diagram-bg);
    --ondine-fg: var(--ink);
    --ondine-surface-alt: var(--diagram-alt);
    --ondine-radius: 6px;
  }
  .fx-pop { transform-box: fill-box; transform-origin: center; }
  .fx-packet { pointer-events: none; }
  footer { max-width: var(--page-max); margin: 0 auto; padding: 0 var(--space-6) var(--space-8); color: var(--ink-soft); font-size: var(--text-s); }
  /* video mode (?video): a fixed frame the renderer drives with __video.frame() */
  .is-video body { overflow: hidden; }
  .is-video header, .is-video footer, .is-video .bar-inner > :not(.caption) { display: none; }
  .is-video .bar {
    position: fixed; top: 0; left: 0; right: 0; height: var(--v-cap-h);
    background: var(--page); border-bottom: 0; backdrop-filter: none;
  }
  .is-video .bar-inner { max-width: none; height: 100%; padding: var(--v-pad) var(--v-pad) 0; align-items: flex-start; }
  .is-video .caption { flex-direction: column; gap: var(--space-2); align-items: flex-start; }
  .is-video .caption .section { font-size: var(--v-text-l); font-weight: 700; color: var(--ink); letter-spacing: -0.02em; }
  .is-video .caption .text { font-size: var(--v-text-m); font-weight: 500; color: var(--ink-soft); }
  .is-video .caption .text.is-reject { color: var(--reject); }
  .is-video main { position: fixed; top: var(--v-cap-h); left: 0; right: 0; bottom: 0; max-width: none; padding: 0 var(--v-pad) var(--v-pad); }
  .is-video .stage { position: relative; height: 100%; padding: 0; overflow: hidden; }
  .is-video .cam, .is-video .head { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  .is-video .head { background: var(--diagram-bg); }
  .is-video .stage svg.ondine { margin: 0; }
  kbd { font-family: var(--font-mono); font-size: var(--text-xs); border: 1px solid var(--rule); border-radius: var(--radius-s); padding: 0 var(--space-1); }
</style>
<style>
  header{display:flex;align-items:center;flex-wrap:wrap;gap:12px;padding-bottom:16px}
  header h1{flex:1;min-width:230px}header a{color:var(--accent);text-decoration:none;font-size:13px}
  .export-tools{display:flex;align-items:center;gap:10px}.export-tools button{min-width:56px}
  .reading-note{color:var(--ink-soft);font-size:14px;max-width:900px;margin:0 0 18px;line-height:1.7}
  .stage{max-height:72vh;overflow:auto;overscroll-behavior:contain}
  .stage svg.ondine{max-width:none}
  .caption{overflow-wrap:anywhere}.bar-inner{align-items:center}
  #png-status{display:block;min-height:1.5em;color:var(--ink-soft);font-size:13px;margin:10px 0}
  select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:6px}
  .back-bottom{color:var(--accent)}
  @media(max-width:600px){header h1{order:3;flex-basis:100%}.export-tools{margin-left:auto}.caption{flex-basis:100%}}
</style></head>

<header><a href="index.html">← 모든 흐름</a><h1>교역 한 항차 — 매입부터 매각까지</h1><div class="export-tools"><a href="03-trade.ondine.svg" download>SVG</a><button id="export-png" type="button" title="전체 다이어그램 저장 · Shift 클릭: 투명 배경">PNG</button><label><input id="transparent-png" type="checkbox"> 투명 배경</label></div></header>
<div class="bar">

    <button id="restart" type="button" aria-label="처음부터"><svg viewBox="0 0 16 16"><path d="M8 3a5 5 0 1 1-4.6 3H1.8A6.5 6.5 0 1 0 3.5 3.4V1.5L.5 4.5l3 3V5.4A5 5 0 0 1 8 3z"/></svg></button>
    <button id="prev" type="button" aria-label="이전 단계"><svg viewBox="0 0 16 16"><path d="M3 2h2v12H3zM14 2v12L6 8z"/></svg></button>

    <div id="speed" class="speed" role="radiogroup" aria-label="속도">
      <button type="button" role="radio" aria-checked="false" data-speed="0.5">0.5x</button>
      <button type="button" role="radio" aria-checked="true" data-speed="1">1x</button>
      <button type="button" role="radio" aria-checked="false" data-speed="1.5">1.5x</button>

    <input id="scrub" class="scrub" type="range" min="0" max="1000" step="1" value="0" aria-label="타임라인">
    <span id="count" class="count">0 / 0</span>
    <button id="show-all" type="button">전체 보기</button><select id="map-zoom" aria-label="다이어그램 확대"><option value="fit">화면 맞춤</option><option value="1">100%</option><option value="1.5">150%</option></select><label class="follow"><input id="follow" type="checkbox" checked> 따라가기</label>
    <div class="caption" aria-live="polite"><span id="section" class="section"></span><span id="text" class="text"></span></div>
  </div>
</div>

e">매각 수량 선택</text></g><g class="ondine-edge-label" data-id="i14"><rect x="205" y="563" width="123.6" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="266.8" y="576.4" text-anchor="middle">판매 금화 수령</text></g><g class="ondine-edge-label" data-id="i15"><rect x="98.8" y="600" width="207.6" height="17" rx="3" fill="var(--_bg)" stroke="none"/><text x="202.6" y="613.4" text-anchor="middle">손익 확인·다음 항차 준비</text></g></g><g class="ondine-notes" font-size="14" fill="var(--_a)" stroke="var(--_b)"><g class="ondine-note" data-id="i1"><rect x="-16" y="60" width="426" height="33" style="rx:var(--_r)"/><text class="ondine-label" stroke="none" fill="var(--_fg)" x="197" y="81.4" text-anchor="middle">출발항에서 매입과 준비</text></g><g class="ondine-note" data-id="i6"><rect x="-16" y="251" width="426" height="33" style="rx:var(--_r)"/><text class="ondine-label" stroke="none" fill="var(--_fg)" x="197" y="272.4" text-anchor="middle">선원·적재 공간·보급을 확인</text></g><g class="ondine-note" data-id="i11"><rect x="-16" y="442" width="576.8" height="33" style="rx:var(--_r)"/><text class="ondine-label" stroke="none" fill="var(--_fg)" x="272.4" y="463.4" text-anchor="middle">도착항에서 판매와 다음 준비</text></g></g><g class="ondine-nodes"><g class="ondine-node ondine-actor ondine-actor-participant ondine-actor-footer" data-id="P"><rect x="-54.4" y="643" width="108.8" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="0" y="670.6" text-anchor="middle">플레이어</text></g><g class="ondine-node ondine-actor ondine-actor-participant ondine-actor-footer" data-id="A"><rect x="164.8" y="643" width="89.6" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="209.6" y="670.6" text-anchor="middle">출발항</text></g><g class="ondine-node ondine-actor ondine-actor-participant ondine-actor-footer" data-id="F"><rect x="344.4" y="643" width="99.2" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="394" y="670.6" text-anchor="middle">내 함대</text></g><g class="ondine-node ondine-actor ondine-actor-participant ondine-actor-footer" data-id="B"><rect x="500" y="643" width="89.6" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="544.8" y="670.6" text-anchor="middle">도착항</text></g><g class="ondine-node ondine-actor ondine-actor-participant" data-id="P"><rect x="-54.4" y="0" width="108.8" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="0" y="27.6" text-anchor="middle">플레이어</text></g><g class="ondine-node ondine-actor ondine-actor-participant" data-id="A"><rect x="164.8" y="0" width="89.6" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="209.6" y="27.6" text-anchor="middle">출발항</text></g><g class="ondine-node ondine-actor ondine-actor-participant" data-id="F"><rect x="344.4" y="0" width="99.2" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="394" y="27.6" text-anchor="middle">내 함대</text></g><g class="ondine-node ondine-actor ondine-actor-participant" data-id="B"><rect x="500" y="0" width="89.6" height="44" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="ondine-label" x="544.8" y="27.6" text-anchor="middle">도착항</text></g></g></g></svg></div></main>
<footer><kbd>Space</kbd> 재생/정지 · <kbd>←</kbd> <kbd>→</kbd> 단계 이동 · <kbd>R</kbd> 처음부터 · PNG: 전체 그림 저장 (Shift: 투명 배경) · <a class="back-bottom" href="index.html">모든 흐름</a></footer>

<script>
(() => {
  // ── timing (ms) and curves, from rossark-motion-skill: travel = ease-in-out, arrive = ease-out
  const CONFIG = {
    noteMs: 460,          // a section note settles in
    drawMinMs: 480,       // shortest arrow draw
    drawMaxMs: 950,       // longest arrow draw
    drawMsPerUnit: 0.42,  // longer arrows travel a little longer (constant-ish speed)
    popMs: 220,           // label / marker / badge arrive
    rejectHoldMs: 260,    // extra beat to read a rejection
    gapMs: 140,           // breath between beats
    glowOutMs: 700,       // active color fades back after the beat
  };
  const bezier = (x1, y1, x2, y2) => {
    const cx = 3 * x1, bx = 3 * (x2 - x1) - cx, ax = 1 - cx - bx;
    const cy = 3 * y1, by = 3 * (y2 - y1) - cy, ay = 1 - cy - by;
    const sx = (t) => ((ax * t + bx) * t + cx) * t;
    const dx = (t) => (3 * ax * t + 2 * bx) * t + cx;
    const sy = (t) => ((ay * t + by) * t + cy) * t;
    return (x) => {
      if (x <= 0) return 0; if (x >= 1) return 1;
      let t = x;
      for (let i = 0; i < 6; i++) { const e = sx(t) - x, d = dx(t); if (Math.abs(e) < 1e-5 || !d) break; t -= e / d; }
      return sy(Math.min(1, Math.max(0, t)));
    };
  };
  const travel = bezier(0.77, 0, 0.175, 1);
  const arrive = bezier(0.23, 1, 0.32, 1);
  const seg = (t, a, b) => (b <= a ? (t >= b ? 1 : 0) : Math.min(1, Math.max(0, (t - a) / (b - a))));

  const svg = document.querySelector('#stage svg.ondine');
  if (!svg) return;
  const NS = 'http://www.w3.org/2000/svg';
  const isSequence = svg.classList.contains('ondine-sequence');
  const byId = (sel, id) => svg.querySelector(`${sel}[data-id="${CSS.escape(id)}"]`);
  const lines = (g) => (g ? [...g.querySelectorAll('text')].flatMap((t) => {
    const spans = t.querySelectorAll('tspan');
    return spans.length ? [...spans].map((s) => s.textContent.trim()) : [t.textContent.trim()];
  }).filter(Boolean) : []);
  const labelText = (g) => lines(g).join(' ');
  const nameOf = (g) => lines(g)[0] || '';
  // CSS transform would replace an SVG transform attribute, so pop an inner wrapper instead
  const popTarget = (el) => {
    if (!el || !el.hasAttribute('transform')) return el;
    if (el.__pop) return el.__pop;
    const inner = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    while (el.firstChild) inner.appendChild(el.firstChild);
    el.appendChild(inner);
    el.__pop = inner;
    return inner;
  };
  const mainPath = (g) => [...g.querySelectorAll(':scope > path')].find((p) => !p.classList.contains('ondine-marker'));

  // ── collect beats
  const beats = [];
  const nodeOf = new Map();
  if (isSequence) {
    const lifelines = [...svg.querySelectorAll('.ondine-lifeline')].map((p) => ({ id: p.dataset.id, x: parseFloat(p.getAttribute('d').slice(1)) }));
    const actor = (id) => [...svg.querySelectorAll(`.ondine-actor[data-id="${CSS.escape(id)}"]`)].find((g) => !g.classList.contains('ondine-actor-footer'));
    const nearest = (x) => lifelines.reduce((a, b) => (Math.abs(b.x - x) < Math.abs(a.x - x) ? b : a), lifelines[0]);
    const items = [...svg.querySelectorAll('.ondine-note[data-id], .ondine-message[data-id]')];
    items.sort((a, b) => parseInt(a.dataset.id.replace(/\D/g, ''), 10) - parseInt(b.dataset.id.replace(/\D/g, ''), 10));
    let section = '';
    for (const g of items) {
      if (g.classList.contains('ondine-note')) {
        section = labelText(g);
        beats.push({ kind: 'note', el: g, section, text: section });
      } else {
        const path = mainPath(g);
        const d = path.getAttribute('d');
        const nums = d.match(/-?\d+(\.\d+)?/g).map(Number);
        const from = nearest(nums[0]), to = nearest(path.getPointAtLength(path.getTotalLength()).x);
        const label = byId('.ondine-edge-label', g.dataset.id);
        const n = g.querySelector('.ondine-sequence-number text');
        const nodes = [actor(from.id), actor(to.id)].filter(Boolean);
        beats.push({
          kind: 'edge', el: g, path, label, section,
          marker: g.querySelector('.ondine-marker'),
          badge: g.querySelector('.ondine-sequence-number'),
          nodes, text: `${n ? n.textContent + ' · ' : ''}${labelText(label)}`,
          names: [nameOf(nodes[0]), nameOf(nodes[1])],
        });
      }
    }
  } else {
    const nodes = [...svg.querySelectorAll('.ondine-node[data-id]')];
    nodes.forEach((g) => nodeOf.set(g.dataset.id, g));
    const ids = [...nodeOf.keys()].sort((a, b) => b.length - a.length);
    const ends = (edgeId) => {
      const m = edgeId.match(/^L_(.+)_\d+$/);
      if (!m) return [];
      for (const a of ids) if (m[1].startsWith(a + '_') && nodeOf.has(m[1].slice(a.length + 1))) return [a, m[1].slice(a.length + 1)];
      return [];
    };
    const seen = new Set();
    for (const g of svg.querySelectorAll('.ondine-edges > .ondine-edge[data-id]')) {
      const path = mainPath(g);
      if (!path) continue;
      const [a, b] = ends(g.dataset.id);
      const label = byId('.ondine-edge-label', g.dataset.id);
      const appear = [a, b].filter((id) => id && !seen.has(id)).map((id) => nodeOf.get(id));
      [a, b].forEach((id) => id && seen.add(id));
      const names = [nameOf(nodeOf.get(a)), nameOf(nodeOf.get(b))];
      const lt = labelText(label);
      beats.push({
        kind: 'edge', el: g, path, label, section: '',
        marker: g.querySelector('.ondine-marker'), badge: null,
        nodes: [nodeOf.get(a), nodeOf.get(b)].filter(Boolean), appear,
        text: `${names[0]} → ${names[1]}${lt ? ' : ' + lt : ''}`, names,
      });
    }
    // nodes no edge touches are part of the opening frame
    beats.orphans = nodes.filter((g) => !seen.has(g.dataset.id));
  }

  // A diagram without animatable edges is a valid static concept view.
  if (!beats.length) {
    document.querySelector('.bar').hidden = true;
    document.querySelector('footer').textContent = '정적 다이어그램 · 이 유형에는 재생할 흐름 단계가 없습니다.';
    window.__flow = { beats: [], TOTAL: 0, static: true, seek: () => {} };
    return;
  }

  // ── prepare: masks for draw-on, packets, pop transforms
  let defs = svg.querySelector('defs');
  if (!defs) { defs = document.createElementNS(NS, 'defs'); svg.prepend(defs); }
  let t0 = 0;
  beats.forEach((b, i) => {
    b.start = t0;
    if (b.kind === 'note') {
      popTarget(b.el).classList.add('fx-pop');
      b.end = t0 + CONFIG.noteMs;
    } else {
      const len = b.path.getTotalLength();
      b.len = len;
      b.reject = !!(b.marker && !/z/i.test(b.marker.getAttribute('d') || ''));
      const draw = Math.min(CONFIG.drawMaxMs, Math.max(CONFIG.drawMinMs, CONFIG.drawMinMs * 0.6 + len * CONFIG.drawMsPerUnit));
      b.drawEnd = t0 + draw;
      b.end = b.drawEnd + CONFIG.popMs + (b.reject ? CONFIG.rejectHoldMs : 0);
      // mask: a solid copy of the path that draws on, so dashed lines keep their dashes
      const mask = document.createElementNS(NS, 'mask');
      mask.setAttribute('id', `fx-mask-${i}`);
      mask.setAttribute('maskUnits', 'userSpaceOnUse');
      mask.setAttribute('x', '-100000'); mask.setAttribute('y', '-100000');
      mask.setAttribute('width', '200000'); mask.setAttribute('height', '200000');
      const mp = document.createElementNS(NS, 'path');
      mp.setAttribute('d', b.path.getAttribute('d'));
      mp.setAttribute('fill', 'none'); mp.setAttribute('stroke', '#fff'); // mask luminance: white = visible
      mp.setAttribute('stroke-width', '14');
      mp.setAttribute('stroke-linecap', 'butt');
      mp.setAttribute('pathLength', '1'); mp.setAttribute('stroke-dasharray', '1 2');
      mask.appendChild(mp);
      b.el.parentNode.insertBefore(mask, b.el);
      b.maskPath = mp;
      b.path.setAttribute('mask', `url(#fx-mask-${i})`);
      // packet: the thing that travels, so the eye follows the flow
      const pk = document.createElementNS(NS, 'g');
      pk.classList.add('fx-packet');
      pk.setAttribute('stroke', 'none');
      const halo = document.createElementNS(NS, 'circle'); halo.setAttribute('r', '9'); halo.setAttribute('opacity', '0.22');
      const dot = document.createElementNS(NS, 'circle'); dot.setAttribute('r', '4.5');
      pk.append(halo, dot);
      b.el.parentNode.appendChild(pk);
      b.packet = pk;
      [b.marker, b.badge, b.label, ...(b.appear || [])].forEach((el) => el && popTarget(el).classList.add('fx-pop'));
    }
    t0 = b.end + CONFIG.gapMs;
  });
  const TOTAL = Math.max(1, t0 - CONFIG.gapMs);

  // ── draw the frame for time t (everything is a function of t: scrub, step and play share it)
  const pop = (el, p) => {
    el = popTarget(el);
    if (!el) return;
    const k = arrive(p);
    el.style.opacity = k;
    el.style.transform = k >= 1 ? '' : `scale(${0.92 + 0.08 * k})`;
  };
  const tint = (el, varName, color, k) => {
    if (!el) return;
    if (k <= 0.001) el.style.removeProperty(varName);
    else el.style.setProperty(varName, `color-mix(in srgb, ${color} ${Math.round(k * 100)}%, var(--_fg))`);
  };
  const setNodeTint = (g, k) => {
    if (!g) return;
    const box = g.__pop || g;
    const rect = box.querySelector(':scope > rect, :scope > path, :scope > polygon, :scope > ellipse, :scope > circle');
    if (!rect) return;
    if (k <= 0.001) { rect.style.removeProperty('stroke'); rect.style.removeProperty('stroke-width'); }
    else {
      rect.style.stroke = `color-mix(in srgb, var(--accent) ${Math.round(k * 100)}%, var(--_b))`;
      rect.style.strokeWidth = `calc(var(--_sw) + ${(k * 1).toFixed(2)}px)`;
    }
  };
  const nodeGlow = new Map();

  function render(t) {
    nodeGlow.clear();
    if (beats.orphans) beats.orphans.forEach((g) => pop(g, 1));
    for (const b of beats) {
      if (b.kind === 'note') { pop(b.el, seg(t, b.start, b.end)); continue; }
      const p = travel(seg(t, b.start, b.drawEnd));
      b.maskPath.setAttribute('stroke-dashoffset', String(1 - p));
      // packet rides the line while it draws, then leaves
      const live = t > b.start && t < b.drawEnd + 120;
      if (live) {
        const pt = b.path.getPointAtLength(b.len * p);
        b.packet.setAttribute('transform', `translate(${pt.x},${pt.y})`);
        b.packet.style.opacity = String(Math.min(1, seg(t, b.start, b.start + 120)) * (1 - seg(t, b.drawEnd, b.drawEnd + 120)));
        b.packet.style.fill = b.reject ? 'var(--reject)' : 'var(--accent)';
      } else b.packet.style.opacity = '0';
      (b.appear || []).forEach((n) => pop(n, seg(t, b.start - CONFIG.popMs, b.start)));
      pop(b.badge, seg(t, b.start, b.start + CONFIG.popMs));
      pop(b.marker, seg(t, b.drawEnd - 60, b.drawEnd - 60 + CONFIG.popMs));
      pop(b.label, seg(t, b.start + (b.drawEnd - b.start) * 0.55, b.start + (b.drawEnd - b.start) * 0.55 + CONFIG.popMs));
      // color: accent while active, fading back after; rejections settle red
      const on = t >= b.start ? 1 - seg(t, b.end, b.end + CONFIG.glowOutMs) : 0;
      if (b.reject && t >= b.drawEnd) tint(b.el, '--_l', 'var(--reject)', 1);
      else tint(b.el, '--_l', b.reject ? 'var(--reject)' : 'var(--accent)', on);
      if (b.label) b.label.style.fill = b.reject && t >= b.drawEnd ? 'var(--reject)' : '';
      b.nodes.forEach((g) => nodeGlow.set(g, Math.max(nodeGlow.get(g) || 0, t >= b.start ? on : 0)));
    }
    allNodes.forEach((g) => setNodeTint(g, nodeGlow.get(g) || 0));
  }
  const allNodes = [...new Set(beats.flatMap((b) => b.nodes || []))];

  // ── clock
  const ui = {
    play: document.getElementById('play'), restart: document.getElementById('restart'),
    prev: document.getElementById('prev'), next: document.getElementById('next'),
    speed: document.getElementById('speed'), scrub: document.getElementById('scrub'),
    count: document.getElementById('count'), follow: document.getElementById('follow'),
    section: document.getElementById('section'), text: document.getElementById('text'),
  };
  const VIDEO = new URLSearchParams(location.search).has('video');
  let video = null;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let t = reduced && !VIDEO ? TOTAL : 0, playing = !reduced && !VIDEO, last = 0, raf = 0, shown = -2, speed = 1;
  const ICON_PLAY = '<svg viewBox="0 0 16 16"><path d="M4 2v12l10-6z"/></svg>';
  const ICON_PAUSE = '<svg viewBox="0 0 16 16"><path d="M3 2h4v12H3zM9 2h4v12H9z"/></svg>';

  const current = () => { let k = -1; for (let i = 0; i < beats.length; i++) if (t >= beats[i].start) k = i; return k; };
  function sync() {
    render(t);
    ui.scrub.value = String(Math.round((t / TOTAL) * 1000));

var(--_b)\" style=\"rx:var(--_r)\"/>\u003ctext class=\"ondine-label\" x=\"544.8\" y=\"670.6\" text-anchor=\"middle\">도착항\u003c/text>\u003c/g>\u003cg class=\"ondine-node ondine-actor ondine-actor-participant\" data-id=\"P\">\u003crect x=\"-54.4\" y=\"0\" width=\"108.8\" height=\"44\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\"/>\u003ctext class=\"ondine-label\" x=\"0\" y=\"27.6\" text-anchor=\"middle\">플레이어\u003c/text>\u003c/g>\u003cg class=\"ondine-node ondine-actor ondine-actor-participant\" data-id=\"A\">\u003crect x=\"164.8\" y=\"0\" width=\"89.6\" height=\"44\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\"/>\u003ctext class=\"ondine-label\" x=\"209.6\" y=\"27.6\" text-anchor=\"middle\">출발항\u003c/text>\u003c/g>\u003cg class=\"ondine-node ondine-actor ondine-actor-participant\" data-id=\"F\">\u003crect x=\"344.4\" y=\"0\" width=\"99.2\" height=\"44\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\"/>\u003ctext class=\"ondine-label\" x=\"394\" y=\"27.6\" text-anchor=\"middle\">내 함대\u003c/text>\u003c/g>\u003cg class=\"ondine-node ondine-actor ondine-actor-participant\" data-id=\"B\">\u003crect x=\"500\" y=\"0\" width=\"89.6\" height=\"44\" fill=\"var(--_s)\" stroke=\"var(--_b)\" style=\"rx:var(--_r)\"/>\u003ctext class=\"ondine-label\" x=\"544.8\" y=\"27.6\" text-anchor=\"middle\">도착항\u003c/text>\u003c/g>\u003c/g>\u003c/g>\u003c/svg>"}</script><script>(() => {
  const data = JSON.parse(document.getElementById('export-data').textContent);
  const stage = document.getElementById('stage');
  const svg = stage.querySelector('svg');
  svg.style.maxWidth = 'none';
  const zoom = document.getElementById('map-zoom');
  const status = document.getElementById('png-status');
  const button = document.getElementById('export-png');
  const applyZoom = () => {
    const box = svg.viewBox.baseVal;
    const padding = parseFloat(getComputedStyle(stage).paddingLeft) + parseFloat(getComputedStyle(stage).paddingRight);
    const ratio = zoom.value === 'fit' ? Math.min(1, (stage.clientWidth - padding) / box.width) : Number(zoom.value);
    svg.style.width = `${box.width * ratio}px`;
    svg.style.height = `${box.height * ratio}px`;
  };
  zoom.addEventListener('change', applyZoom);
  new ResizeObserver(applyZoom).observe(stage);
  applyZoom();
  document.getElementById('show-all').addEventListener('click', () => {
    window.__flow.seek(window.__flow.TOTAL);
    stage.scrollTo({top:0, left:0, behavior:'instant'});
  });
  button.addEventListener('click', async event => {
    button.disabled = true;
    status.textContent = '전체 그림을 저장하고 있습니다…';
    let imageUrl, downloadUrl;
    try {
      await document.fonts.ready;
      const transparent = event.shiftKey || document.getElementById('transparent-png').checked;
      const documentSvg = new DOMParser().parseFromString(data.svg, 'image/svg+xml').documentElement;
      const bounds = documentSvg.getAttribute('viewBox').split(/[ ,]+/).map(Number);
      const width = bounds[2], height = bounds[3];
      // Export the original completed SVG, independent of playback position and zoom.
      documentSvg.setAttribute('width', String(width));
      documentSvg.setAttribute('height', String(height));
      documentSvg.style.background = 'transparent';
      const scale = Math.min(2, 8192 / width, 8192 / height);
      const canvas = document.createElement('canvas');
      canvas.width = Math.ceil(width * scale);
      canvas.height = Math.ceil(height * scale);
      const context = canvas.getContext('2d');
      if (!context) throw new Error('이미지 저장을 사용할 수 없습니다.');
      if (!transparent) { context.fillStyle = '#ffffff'; context.fillRect(0, 0, canvas.width, canvas.height); }
      imageUrl = URL.createObjectURL(new Blob([new XMLSerializer().serializeToString(documentSvg)], {type:'image/svg+xml;charset=utf-8'}));
      const img = new Image();
      img.src = imageUrl;
      await img.decode();
      context.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
      if (!blob) throw new Error('이미지를 만들지 못했습니다.');
      downloadUrl = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = downloadUrl;
      link.download = data.id + (transparent ? '-transparent' : '') + '.png';
      document.body.append(link); link.click(); link.remove();
      status.textContent = `전체 그림 저장 완료 · ${canvas.width} × ${canvas.height}${transparent ? ' · 투명 배경' : ''}`;
    } catch (error) {
      status.textContent = 'PNG 저장에 실패했습니다. SVG 링크로 전체 그림을 저장할 수 있습니다.';
      console.error(error);
    } finally {
      button.disabled = false;
      if (imageUrl) URL.revokeObjectURL(imageUrl);
      if (downloadUrl) setTimeout(() => URL.revokeObjectURL(downloadUrl), 60000);
    }
  });
})();
