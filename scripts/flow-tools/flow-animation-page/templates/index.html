<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__TITLE__</title>
<style>
  :root {
    --page: #f6f6f4;
    --panel: #ffffff;
    --ink: #1b1b1a;
    --ink-soft: #5d5d58;
    --rule: #dcdcd6;
    --accent: #2f6fde;
    --thumb-bg: #ffffff;
    --space-2: 6px;
    --space-3: 8px;
    --space-4: 12px;
    --space-5: 16px;
    --space-6: 24px;
    --space-7: 32px;
    --radius: 12px;
    --text-s: 13px;
    --text-m: 15px;
    --text-l: 17px;
    --text-xl: 22px;
    --card-min: 300px;
    --thumb-h: 220px;
    --page-max: 1200px;
    --lift: -2px;
    --focus-w: 2px;
    --dur: 180ms;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --font-ui: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Segoe UI", sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --page: #141413;
      --panel: #1e1e1c;
      --ink: #ececea;
      --ink-soft: #a3a39d;
      --rule: #34342f;
      --accent: #6d9cff;
      --thumb-bg: #f4f4f1;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --page: #141413;
    --panel: #1e1e1c;
    --ink: #ececea;
    --ink-soft: #a3a39d;
    --rule: #34342f;
    --accent: #6d9cff;
    --thumb-bg: #f4f4f1;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--page); color: var(--ink); font-family: var(--font-ui); font-size: var(--text-m); line-height: 1.5; }
  main { max-width: var(--page-max); margin: 0 auto; padding: var(--space-7) var(--space-5); }
  h1 { margin: 0 0 var(--space-2); font-size: var(--text-xl); font-weight: 700; letter-spacing: -0.01em; }
  .lead { margin: 0 0 var(--space-6); color: var(--ink-soft); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, var(--card-min)), 1fr)); gap: var(--space-5); }
  .card {
    display: flex; flex-direction: column; overflow: hidden; color: inherit; text-decoration: none;
    background: var(--panel); border: 1px solid var(--rule); border-radius: var(--radius);
    transition: transform var(--dur) var(--ease-out), border-color var(--dur);
  }
  .card:hover { transform: translateY(var(--lift)); border-color: var(--ink-soft); }
  .card:active { transform: scale(0.98); }
  .card:focus-visible { outline: var(--focus-w) solid var(--accent); outline-offset: var(--focus-w); }
  .thumb { height: var(--thumb-h); background: var(--thumb-bg); border-bottom: 1px solid var(--rule); display: flex; align-items: center; justify-content: center; padding: var(--space-4); }
  .thumb img { max-width: 100%; max-height: 100%; }
  .meta { padding: var(--space-4) var(--space-5) var(--space-5); }
  .kind { font-size: var(--text-s); color: var(--accent); font-weight: 600; }
  .meta h2 { margin: var(--space-2) 0; font-size: var(--text-l); font-weight: 650; }
  .meta p { margin: 0; color: var(--ink-soft); font-size: var(--text-s); }
  footer { margin-top: var(--space-6); color: var(--ink-soft); font-size: var(--text-s); }
</style>
</head>
<body>
<main>
  <h1>__TITLE__</h1>
  <p class="lead">카드를 누르면 흐름이 순서대로 재생됩니다. Space 재생/정지, ←/→ 단계 이동.</p>
  <div class="grid"><!--CARDS-->
  </div>
  <footer>Mermaid → Ondine SVG → ondine-flow-motion 플레이어</footer>
</main>
</body>
</html>
